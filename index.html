<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>WEEX-style Trading UI (Demo)</title>
  <style>
    :root{
      --bg:#0b0b0b;
      --panel:#0f0f0f;
      --muted:#9aa0a6;
      --accent:#f3c623; /* yellow */
      --green:#21c77a;
      --red:#ff5c6c;
      --card:#111;
      --glass: rgba(255,255,255,0.03);
      --radius:24px;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#070707 0%, #0b0b0b 100%);color:#fff}
    .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:12px 12px 80px;box-sizing:border-box}
    /* top bar */
    .topbar{display:flex;align-items:center;gap:12px;padding:8px 6px}
    .logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#f3c623,#ffb84d);display:flex;align-items:center;justify-content:center;font-weight:700;color:#111}
    .download{margin-left:auto;background:var(--accent);color:#0b0b0b;padding:6px 14px;border-radius:999px;font-weight:700}
    .signup{width:100%;display:block;margin:10px auto 16px;padding:12px;border-radius:999px;background:#fff;color:#0b0b0b;font-weight:700;text-align:center}
    /* tabs */
    .tabs{display:flex;gap:14px;overflow:auto;padding:6px 3px 12px}
    .tabs button{background:transparent;border:0;color:#cdd3d9;font-weight:700;padding:6px 8px;font-size:15px}
    .tabs button.active{color:#fff;position:relative}
    .tabs button.active::after{content:"";position:absolute;left:0;bottom:-8px;height:3px;background:var(--accent);width:100%;border-radius:3px}
    /* subfilter */
    .subfilter{display:flex;gap:8px;padding:10px 4px}
    .pill{background:var(--glass);padding:8px 12px;border-radius:18px;color:#ddd;font-weight:700}
    .pill.active{background:#222;color:#fff}
    /* list */
    .list{margin-top:6px}
    .item{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid rgba(255,255,255,0.03)}
    .left{display:flex;gap:12px;align-items:center}
    .icon{width:44px;height:44px;border-radius:12px;background:#111;display:flex;align-items:center;justify-content:center;font-size:18px}
    .meta{display:flex;flex-direction:column}
    .symbol{font-weight:700}
    .badge{background:#222;color:#ddd;padding:4px 8px;border-radius:8px;font-size:12px;margin-left:6px}
    .price{font-size:18px;font-weight:700}
    .percent{font-weight:700}
    .percent.up{color:var(--green)}
    .percent.down{color:var(--red)}
    /* chart panel */
    .chart-card{background:linear-gradient(180deg,#0e0e0e,#0c0c0c);padding:12px;border-radius:16px;margin-bottom:12px}
    .chart-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
    .chart-title{font-weight:800}
    .chart-sub{color:var(--muted);font-size:13px}
    canvas{width:100%!important;height:220px!important}
    /* bottom nav */
    .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;background:linear-gradient(180deg,#161616,#0f0f0f);border-radius:40px;padding:10px 16px;box-shadow:0 6px 30px rgba(0,0,0,0.6);display:flex;gap:18px;align-items:center;z-index:40;max-width:480px}
    .nav-item{display:flex;flex-direction:column;align-items:center;color:#aaa;font-size:12px;background:transparent;border:0;padding:8px 10px;border-radius:12px}
    .nav-item.active{background:rgba(255,255,255,0.03);color:#fff}
    /* responsive tweaks */
    @media(min-width:700px){
      .app{padding:20px}
      canvas{height:300px!important}
    }
    /* small helpers */
    .small{font-size:12px;color:var(--muted)}
    .row{display:flex;align-items:center}
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="topbar">
      <div class="logo">W</div>
      <div style="display:flex;flex-direction:column">
        <div style="font-weight:800">WEEX Cryp...</div>
        <div style="font-size:12px;color:var(--muted)">weex.com</div>
      </div>
      <div class="download" id="downloadBtn">Download</div>
    </div>

    <div class="signup">Sign Up</div>

    <div class="tabs" id="mainTabs">
      <button class="active" data-tab="hot">Hot</button>
      <button data-tab="gainers">Gainers</button>
      <button data-tab="losers">Losers</button>
      <button data-tab="trending">Trending</button>
      <button data-tab="listing">Listing</button>
    </div>

    <div class="subfilter">
      <div class="pill active" data-filter="futures">Futures</div>
      <div class="pill" data-filter="tradfi">TradFi 🔥</div>
      <div class="pill" data-filter="spot">Spot</div>
    </div>

    <div id="chartArea" class="chart-card" style="display:none">
      <div class="chart-top">
        <div>
          <div class="chart-title" id="chartSymbol">BTCUSDT</div>
          <div class="chart-sub" id="chartPrice">79,999.9 • <span id="chartChange" class="small up">+2.07%</span></div>
        </div>
        <div class="row small">
          <div style="margin-right:8px">1D</div>
          <div style="background:rgba(255,255,255,0.06);padding:6px 10px;border-radius:8px">Indicators</div>
        </div>
      </div>
      <canvas id="priceChart"></canvas>
    </div>

    <div class="list" id="marketList">
      <!-- JS will fill -->
    </div>

  </div>

  <div class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-name="home">🏠<span style="margin-top:6px">Home</span></button>
    <button class="nav-item" data-name="markets">📈<span style="margin-top:6px">Markets</span></button>
    <button class="nav-item" data-name="futures">🧾<span style="margin-top:6px">Futures</span></button>
    <button class="nav-item" data-name="trade">🔁<span style="margin-top:6px">Trade</span></button>
    <button class="nav-item" data-name="assets">💼<span style="margin-top:6px">Assets</span></button>
  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Mock market data (initial)
    const markets = [
      {id:'BTCUSDT', name:'BTC', extra:'400x', price:79999.9, change:2.07, type:'futures', icon:'🟠'},
      {id:'ETHUSDT', name:'ETH', extra:'400x', price:2500.67, change:1.33, type:'futures', icon:'🔷'},
      {id:'SOLUSDT', name:'SOL', extra:'300x', price:109.24, change:12.86, type:'futures', icon:'🟣'},
      {id:'COWUSDT', name:'COW', extra:'New', price:0.04871, change:4.86, type:'spot', icon:'🐮'},
      {id:'PEPEUSDT', name:'1000PEPE', extra:'', price:0.0039154, change:5.73, type:'spot', icon:'🐸'},
      {id:'XRPU', name:'XRPU', extra:'300x', price:1.4530, change:5.74, type:'futures', icon:'⚪'},
    ];

    // DOM refs
    const listEl = document.getElementById('marketList');
    const chartArea = document.getElementById('chartArea');
    const chartSymbol = document.getElementById('chartSymbol');
    const chartPrice = document.getElementById('chartPrice');
    const chartChange = document.getElementById('chartChange');

    // active
    let activeFilter = 'futures';
    let activeTab = 'hot';
    let activeMarket = markets[0].id;

    // Build market list UI
    function renderList(){
      listEl.innerHTML = '';
      const filtered = markets.filter(m=>{
        if(activeFilter==='futures') return true; // show all for demo (you can filter)
        if(activeFilter==='spot') return m.type==='spot';
        if(activeFilter==='tradfi') return m.type==='tradfi';
        return true;
      });
      filtered.forEach(m=>{
        const it = document.createElement('div');
        it.className = 'item';
        it.innerHTML = `
          <div class="left">
            <div class="icon">${m.icon}</div>
            <div class="meta">
              <div style="display:flex;align-items:center">
                <div class="symbol">${m.name}</div>
                ${m.extra?`<div class="badge">${m.extra}</div>`:''}
              </div>
              <div class="small">${m.id}</div>
            </div>
          </div>
          <div style="text-align:right">
            <div class="price">${formatPrice(m.price)}</div>
            <div class="percent ${m.change>=0?'up':'down'}">${m.change>=0?'+':''}${m.change.toFixed(2)}%</div>
          </div>
        `;
        it.addEventListener('click',()=>onSelectMarket(m.id));
        listEl.appendChild(it);
      });
    }

    // price formatter
    function formatPrice(v){
      if(v>=1000) return new Intl.NumberFormat().format(Math.round(v*100)/100);
      if(v>=1) return v.toFixed(4).replace(/\.?0+$/,'');
      return v.toPrecision(6);
    }

    // Chart setup
    let chart = null;
    let seriesData = [];
    function createChart(initial){
      const ctx = document.getElementById('priceChart').getContext('2d');
      if(chart) chart.destroy();
      chart = new Chart(ctx, {
        type:'line',
        data:{
          labels:initial.map((_,i)=>i),
          datasets:[{
            label: 'Price',
            data: initial,
            borderColor:'#f3c623',
            backgroundColor:'rgba(243,198,35,0.06)',
            pointRadius:0,
            tension:0.25,
          }]
        },
        options:{
          responsive:true,
          maintainAspectRatio:false,
          scales:{
            x:{display:false},
            y:{grid:{color:'rgba(255,255,255,0.03)'}}
          },
          plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}}
        }
      });
    }

    // When user selects a market
    function onSelectMarket(id){
      activeMarket = id;
      const m = markets.find(x=>x.id===id);
      if(!m) return;
      chartArea.style.display = 'block';
      chartSymbol.textContent = m.id;
      chartPrice.innerHTML = formatPrice(m.price) + ' • ';
      chartChange.textContent = `${m.change>=0?'+':''}${m.change.toFixed(2)}%`;
      chartChange.className = 'small ' + (m.change>=0?'up':'down');

      // build mock series
      seriesData = buildSeries(m.price);
      createChart(seriesData);
    }

    // Build a mock series around a base price
    function buildSeries(base){
      const len = 60;
      const arr = [];
      let p = base;
      for(let i=0;i<len;i++){
        const delta = (Math.random()-0.5) * (Math.max(1, base*0.002));
        p = Math.max(0.000001, p + delta);
        arr.push(Math.round(p*100000)/100000);
      }
      return arr;
    }

    // Live update prices every second (simulate real market)
    function liveUpdate(){
      // mutate markets
      markets.forEach(m=>{
        const vol = Math.max(0.00001, (Math.random()-0.5) * (m.price * 0.002));
        m.price = Math.max(0.0000001, m.price + vol);
        // recalc change as percentage from a synthetic previous (for demo)
        m.change = ((Math.random()-0.4)*6); // random change between -4..+? to look lively
      });
      renderList();
      // update chart if visible
      if(chart && activeMarket){
        const m = markets.find(x=>x.id===activeMarket);
        if(m){
          // push new point
          const last = chart.data.datasets[0].data;
          const newp = Math.max(0.000001, last[last.length-1] + (Math.random()-0.5)*(m.price*0.0008));
          last.push(Math.round(newp*100000)/100000);
          // keep length
          while(last.length>100) last.shift();
          chart.data.labels = last.map((_,i)=>i);
          chart.update('none');
          chartPrice.innerHTML = formatPrice(m.price) + ' • ';
          chartChange.textContent = `${m.change>=0?'+':''}${m.change.toFixed(2)}%`;
          chartChange.className = 'small ' + (m.change>=0?'up':'down');
        }
      }
      setTimeout(liveUpdate, 1000);
    }

    // setup filters and tabs interactivity
    document.querySelectorAll('.pill').forEach(el=>{
      el.addEventListener('click',()=>{
        document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        activeFilter = el.getAttribute('data-filter');
        renderList();
      });
    });
    document.querySelectorAll('#mainTabs button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('#mainTabs button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.getAttribute('data-tab');
        // For demo: no deep filtering, but could be added
      });
    });

    // bottom nav events
    document.querySelectorAll('.nav-item').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
        btn.classList.add('active');
        const name = btn.getAttribute('data-name');
        // demo switch: if markets selected, scroll to list; if trade selected open chart area
        if(name==='markets'){
          window.scrollTo({top:200,behavior:'smooth'});
        } else if(name==='trade'){
          // open chart for active market
          if(!chartArea.style.display || chartArea.style.display==='none') {
            onSelectMarket(activeMarket || markets[0].id);
          }
        } else if(name==='assets'){
          alert('Assets screen — demo only');
        } else if(name==='home'){
          window.scrollTo({top:0,behavior:'smooth'});
        } else if(name==='futures'){
          // activate futures pill
          document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
          document.querySelector('.pill[data-filter="futures"]').classList.add('active');
          activeFilter='futures';
          renderList();
        }
        console.log('Nav clicked:',name);
      });
    });

    document.getElementById('downloadBtn').addEventListener('click',()=>alert('Download action (demo)'));

    // initial render
    renderList();
    onSelectMarket(activeMarket);

    // start live update
    setTimeout(liveUpdate,1000);

    // small accessibility: allow keyboard selection (demo)
    window.addEventListener('keydown',(e)=>{
      if(e.key==='ArrowDown' || e.key==='j'){ /* next item */}
    });

    // Notes:
    // - This is a demo single-file app. For real production:
    //   * Replace mock data with WebSocket/REST price feed
    //   * Use proper routing and componentization (React/Vue)
    //   * Securely handle user auth, wallets, and real trading endpoints
  </script>
</body>
</html>
